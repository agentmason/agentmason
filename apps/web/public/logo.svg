<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" fill="none">
  <defs>
    <linearGradient id="blueLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="purpleRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="topBlue" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="scBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="scPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="scTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="scTopL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="scTopR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
  </defs>

  <!-- ===== MAIN LARGE CUBE ===== -->
  <!-- Top face -->
  <polygon points="120,80 200,120 120,160 40,120" fill="url(#topBlue)"/>
  <!-- Left face (blue) -->
  <polygon points="40,120 120,160 120,230 40,190" fill="url(#blueLeft)"/>
  <!-- Right face (purple) -->
  <polygon points="200,120 120,160 120,230 200,190" fill="url(#purpleRight)"/>

  <!-- White edge highlights on main cube -->
  <line x1="120" y1="160" x2="120" y2="230" stroke="white" stroke-width="2.5" opacity="0.45"/>
  <line x1="40" y1="120" x2="40" y2="190" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="120" x2="200" y2="190" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="40" y1="190" x2="120" y2="230" stroke="white" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="190" x2="120" y2="230" stroke="white" stroke-width="1" opacity="0.15"/>

  <!-- Internal horizontal structure line -->
  <line x1="40" y1="155" x2="120" y2="195" stroke="white" stroke-width="1.2" opacity="0.18"/>
  <line x1="200" y1="155" x2="120" y2="195" stroke="white" stroke-width="1.2" opacity="0.18"/>

  <!-- ===== SMALL CUBE: CENTER TOP ===== -->
  <polygon points="120,30 148,45 120,60 92,45" fill="url(#scTop)"/>
  <polygon points="92,45 120,60 120,82 92,67" fill="url(#scBlue)"/>
  <polygon points="148,45 120,60 120,82 148,67" fill="url(#scPurple)"/>
  <!-- white edges -->
  <line x1="120" y1="60" x2="120" y2="82" stroke="white" stroke-width="1.5" opacity="0.5"/>

  <!-- ===== SMALL CUBE: LEFT TOP ===== -->
  <polygon points="68,52 96,67 68,82 40,67" fill="url(#scTopL)"/>
  <polygon points="40,67 68,82 68,104 40,89" fill="url(#scBlue)"/>
  <polygon points="96,67 68,82 68,104 96,89" fill="#6366f1"/>
  <line x1="68" y1="82" x2="68" y2="104" stroke="white" stroke-width="1.5" opacity="0.5"/>

  <!-- ===== SMALL CUBE: RIGHT TOP ===== -->
  <polygon points="172,52 200,67 172,82 144,67" fill="url(#scTopR)"/>
  <polygon points="144,67 172,82 172,104 144,89" fill="#818cf8"/>
  <polygon points="200,67 172,82 172,104 200,89" fill="url(#scPurple)"/>
  <line x1="172" y1="82" x2="172" y2="104" stroke="white" stroke-width="1.5" opacity="0.5"/>

  <!-- ===== VERTICAL CONNECTORS: small cubes to main cube ===== -->
  <!-- Center -->
  <line x1="120" y1="82" x2="120" y2="80" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- Left connector -->
  <line x1="68" y1="104" x2="68" y2="108" stroke="white" stroke-width="1.8" opacity="0.5"/>
  <circle cx="68" cy="110" r="2.5" fill="white" opacity="0.6"/>
  <!-- Right connector -->
  <line x1="172" y1="104" x2="172" y2="108" stroke="white" stroke-width="1.8" opacity="0.5"/>
  <circle cx="172" cy="110" r="2.5" fill="white" opacity="0.6"/>

  <!-- ===== HORIZONTAL CONNECTOR LINES between small cubes ===== -->
  <line x1="96" y1="78" x2="92" y2="76" stroke="white" stroke-width="1.2" opacity="0.35"/>
  <line x1="148" y1="78" x2="144" y2="76" stroke="white" stroke-width="1.2" opacity="0.35"/>

  <!-- ===== NODE DOTS on small cube tops ===== -->
  <circle cx="120" cy="30" r="3" fill="white" opacity="0.7"/>
  <circle cx="68" cy="52" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="172" cy="52" r="2.5" fill="white" opacity="0.6"/>

  <!-- ===== LETTER A on left face ===== -->
  <g transform="translate(56, 145)">
    <path d="M 0,50 L 20,-10 L 40,50 L 33,50 L 28,36 L 12,36 L 7,50 Z M 14,30 L 26,30 L 20,8 Z" fill="white" opacity="0.95"/>
  </g>

  <!-- ===== LETTER M on right face ===== -->
  <g transform="translate(128, 145)">
    <path d="M 0,50 L 0,-10 L 18,25 L 36,-10 L 36,50 L 29,50 L 29,12 L 18,35 L 7,12 L 7,50 Z" fill="white" opacity="0.95"/>
  </g>
</svg>
